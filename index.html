<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OBノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>OBノート</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#17231d;--sub:#5b6a62;--line:#dfe5e0;--accent:#1f6b4a;--accent-ink:#fff;--soft:#e4efe8;--warn:#b3261e;--warn-soft:#fbe9e7;--pen:#a35c00;--pen-soft:#fff1dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18201b;--ink:#e8efe9;--sub:#9aaba1;--line:#2a352f;--accent:#4fb389;--accent-ink:#06130d;--soft:#1f2e26;--warn:#ff8a80;--warn-soft:#3a1c1a;--pen:#ffb74d;--pen-soft:#3a2a12}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18201b;--ink:#e8efe9;--sub:#9aaba1;--line:#2a352f;--accent:#4fb389;--accent-ink:#06130d;--soft:#1f2e26;--warn:#ff8a80;--warn-soft:#3a1c1a;--pen:#ffb74d;--pen-soft:#3a2a12}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;min-height:48px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.big{width:100%;min-height:72px;font-size:20px}
button.sel{background:var(--soft);border-color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
button.ob.sel{background:var(--warn-soft);border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
button.pen.sel{background:var(--pen-soft);border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen);color:var(--pen)}
button.link{border:none;background:none;color:var(--accent);min-height:auto;padding:6px 0;text-decoration:underline}
.grid{display:grid;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.grid button{padding:10px 4px;min-height:46px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.label{font-size:13px;color:var(--sub);margin:12px 0 6px;font-weight:600}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hole{font-size:28px;font-weight:800}
.shots{list-style:none;margin:0;padding:0}
.shots li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.shots li:last-child{border-bottom:none}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--soft)}
.tag.ob{background:var(--warn-soft);color:var(--warn)}.tag.pen{background:var(--pen-soft);color:var(--pen)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.bar{display:grid;grid-template-columns:9.5em 1fr 4.5em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar .t{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--warn)}
.bar .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.few{opacity:.55}
.notice{font-size:13px;color:var(--sub);background:var(--soft);border-radius:10px;padding:8px 10px}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;font-size:36px;font-weight:800}
.stepper button{width:64px;font-size:28px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="analysis.js"></script>
<script src="app.js"></script>
</body>
</html>
